# Prometheus scrape configuration for StudentHub
# Drop this into your prometheus.yml scrape_configs section

scrape_configs:
  - job_name: studenthub-api
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['api:5000']
    metrics_path: /api/metrics
    honor_labels: true

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

---
# Grafana dashboard provisioning (grafana/provisioning/dashboards/studenthub.json)
# Import dashboard ID 1860 (Node Exporter Full) from grafana.com for Node.js metrics
# Import dashboard ID 763 for Redis metrics

