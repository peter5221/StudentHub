services:
  # ── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: studenthub-api
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - studenthub_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Client (nginx) ──────────────────────────────────────────────────────────
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: studenthub-client
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - studenthub_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: studenthub-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - studenthub_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Backup Scheduler ────────────────────────────────────────────────────────
  backup:
    image: alpine:3.19
    container_name: studenthub-backup
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      BACKUP_BUCKET: ${BACKUP_BUCKET}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - db_data:/data/db:ro
      - uploads_data:/data/uploads:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    networks:
      - studenthub_net
    depends_on:
      - api

networks:
  studenthub_net:
    driver: bridge

volumes:
  uploads_data:
  db_data:
  redis_data:

